# Migrações do banco local (spec §7.3). Rode os comandos a partir de backend/.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Vazio: o env.py usa DATABASE_PATH das configurações (app/config.py).
# Os testes informam aqui o caminho de um banco temporário.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
